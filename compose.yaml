services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: course_registration
      POSTGRES_USER: course_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-course_app_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U course_app -d course_registration"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://course_app:${POSTGRES_PASSWORD:-course_app_dev}@db:5432/course_registration
      APP_SECRET_KEY: ${APP_SECRET_KEY:-local-development-secret-change-me}
      PORT: 8000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-memory://}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
