name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: course_registration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d course_registration_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify schema migrations
        env:
          DATABASE_URL: sqlite:///migration_ci.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run unit and API tests
        run: python -m pytest -q -m "not postgres"

      - name: Prepare PostgreSQL integration database
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/course_registration_test
        run: alembic upgrade head

      - name: Run PostgreSQL final-seat concurrency test
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/course_registration_test
        run: python -m pytest -q tests/test_postgres_concurrency.py

      - name: Build production container
        run: docker build --tag course-registration-api:ci .
